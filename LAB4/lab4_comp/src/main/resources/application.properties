spring.application.name=vros
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5555/vros}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# SQL creates the tables; Hibernate only checks the entity mappings.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.demo.enabled=${DEMO_ENABLED:true}

# Implicit este activ profilul securizat; dev se selecteaza explicit.
spring.profiles.default=prod
app.jwt.ttl-seconds=3600
app.admin.email=${ADMIN_EMAIL:admin@vros.local}
app.admin.password=${ADMIN_PASSWORD:}
